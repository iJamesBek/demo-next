name: CI-frontend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5

      - name: Install dependencies
        run: npm i

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
